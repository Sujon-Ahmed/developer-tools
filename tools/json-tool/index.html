<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Validator - DevTools</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="../../index.html" class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        DevTools
      </a>
      <ul class="nav-links">
        <li><a href="../../index.html">&larr; Back to Tools</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="tool-header">
      <h1 class="tool-title-main">JSON Formatter & Validator</h1>
      <p class="tool-subtitle">Format, minify, validate, and parse JSON data with syntax checks and formatting indentation sizing.</p>
    </div>

    <div class="tool-container">
      <div class="input-panel">
        <div class="panel-header">
          <h3>Raw JSON Input</h3>
          <div class="file-input-wrapper">
            <button class="action-btn-sm" id="btn-clear-input">Clear</button>
            <button class="action-btn-sm" id="btn-sample-json">Load Sample</button>
          </div>
        </div>
        <textarea id="json-input" placeholder="Paste your raw JSON string here..." autofocus></textarea>
        <div id="validation-alert" class="validation-bar">JSON is ready to validate</div>
      </div>

      <div class="options-panel">
        <div class="options-group">
          <label class="options-title">Indentation Size</label>
          <select id="indent-size" class="select-dropdown">
            <option value="2" selected>2 Spaces</option>
            <option value="4">4 Spaces</option>
            <option value="tab">Tab</option>
          </select>
        </div>

        <button class="primary-btn" id="btn-format">Format JSON</button>
        <button class="secondary-btn" id="btn-minify">Minify JSON</button>
      </div>

      <div class="output-panel">
        <div class="panel-header">
          <h3>Formatted Output</h3>
          <div class="file-input-wrapper">
            <button class="action-btn-sm" id="btn-copy-output">Copy</button>
          </div>
        </div>
        <textarea id="json-output" readonly placeholder="Formatted result will appear here..."></textarea>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Developer Tools Suite. Running client-side securely.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
