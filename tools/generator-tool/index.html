<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password & UUID Generator - DevTools</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="../../index.html" class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>
        DevTools
      </a>
      <ul class="nav-links">
        <li><a href="../../index.html">&larr; Back to Tools</a></li>
      </ul>
    </div>
  </header>

  <main>
    <div class="tool-header">
      <h1 class="tool-title-main">Password & UUID Generator</h1>
      <p class="tool-subtitle">Generate highly secure randomized passwords or bulk UUID v4 strings instantly in-browser.</p>
    </div>

    <div class="generator-layout">
      <!-- Password Generator Card -->
      <div class="gen-card">
        <div class="gen-card-header">
          <h3>Secure Password Generator</h3>
        </div>
        <div class="gen-output-container">
          <input type="text" id="pass-output" readonly placeholder="Click generate button...">
          <button class="action-btn-sm" id="btn-copy-pass">Copy</button>
        </div>
        <div class="strength-meter-wrapper">
          <div class="strength-bar-bg">
            <div id="strength-bar" class="strength-bar"></div>
          </div>
          <span id="strength-label" class="strength-label">Password Strength</span>
        </div>

        <div class="gen-options">
          <div class="option-slider-group">
            <div class="slider-header">
              <label>Password Length</label>
              <span id="length-val">16</span>
            </div>
            <input type="range" id="pass-length" min="6" max="64" value="16">
          </div>

          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="pass-upper" checked>
              <span>Uppercase Letters (A-Z)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="pass-lower" checked>
              <span>Lowercase Letters (a-z)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="pass-numbers" checked>
              <span>Numbers (0-9)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="pass-symbols" checked>
              <span>Special Symbols (!@#$...)</span>
            </label>
          </div>
        </div>

        <button class="primary-btn" id="btn-gen-pass">Generate Password</button>
      </div>

      <!-- UUID Generator Card -->
      <div class="gen-card teal">
        <div class="gen-card-header">
          <h3>UUID v4 Generator</h3>
        </div>
        <div class="gen-options">
          <div class="option-slider-group">
            <div class="slider-header">
              <label>Batch Size (Quantity)</label>
              <span id="uuid-qty-val">5</span>
            </div>
            <input type="range" id="uuid-quantity" min="1" max="50" value="5">
          </div>

          <div class="checkbox-group">
            <label class="checkbox-label">
              <input type="checkbox" id="uuid-uppercase">
              <span>Uppercase Output</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="uuid-hyphens" checked>
              <span>Include Hyphens</span>
            </label>
          </div>
        </div>

        <button class="primary-btn" id="btn-gen-uuid">Generate UUIDs</button>

        <div class="uuid-results-container">
          <div class="panel-header">
            <h4>UUIDs Output</h4>
            <button class="action-btn-sm" id="btn-copy-uuids">Copy All</button>
          </div>
          <textarea id="uuids-output" readonly placeholder="UUIDs will appear here..."></textarea>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Developer Tools Suite. Running client-side securely.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
